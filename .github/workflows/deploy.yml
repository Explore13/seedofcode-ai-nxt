name: SeedofCode AI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev_surya

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # =========================================================================
  # 1. TEST PHASE (Runs for both branches)
  # =========================================================================
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Run Code Review (Linting)
        run: pnpm lint
      - name: Run Typecheck (TypeScript)
        run: pnpm typecheck

  # =========================================================================
  # 2. PREVIEW PHASE (Runs ONLY for dev_surya)
  # =========================================================================
  Deploy-Preview:
    needs: Test # This forces the Deploy job to wait for the Test job to pass
    if: github.ref == 'refs/heads/dev_surya'
    runs-on: ubuntu-latest
    environment: Preview # <--- This maps to the exact Environment name in GitHub!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install

      - name: Build Test
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          BACKEND_PROXY_TARGET: ${{ secrets.BACKEND_PROXY_TARGET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}

      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: Pull Vercel Preview Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel Preview Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel Preview URL
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          vercel alias set $DEPLOYMENT_URL seedofcode-ai-stg.vercel.app --token=${{ secrets.VERCEL_TOKEN }}

  # =========================================================================
  # 3. PRODUCTION PHASE (Runs ONLY for main)
  # =========================================================================
  Deploy-Production:
    needs: Test # This forces the Deploy job to wait for the Test job to pass
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production # <--- This maps to the exact Environment name in GitHub!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install

      - name: Build Test
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          BACKEND_PROXY_TARGET: ${{ secrets.BACKEND_PROXY_TARGET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}

      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: Pull Vercel Production Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel Production Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel Production URL
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
